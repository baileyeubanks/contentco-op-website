name: CCO CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_KEY: test-service-key
      CCO_SESSION_SECRET: test-session-secret
      CCO_INVITE_CODE: test-invite-code
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_example
      STRIPE_SECRET_KEY: sk_test_example
      STRIPE_WEBHOOK_SECRET: whsec_test
      NEXT_PUBLIC_FIREBASE_API_KEY: test-firebase-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
      CCO_FIREBASE_PROJECT_ID: test-project
      FIREBASE_PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/home/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Public contract checks
        run: |
          npm run ops:portfolio
          npm run ops:pwa

      - name: Type check
        run: npm run typecheck -w @contentco-op/home

      - name: Lint
        run: npm run lint -w @contentco-op/home

      - name: Unit tests
        run: npm test -w @contentco-op/home

      - name: Build
        run: npm run build -w @contentco-op/home

  db-contract:
    # Proves the CCO-DB RLS and brief_submitted contracts against a scratch
    # Postgres built from infra/supabase/migrations. Never touches a Supabase project.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - name: RLS + event contract (scratch database)
        run: bash infra/supabase/tests/rls/run.sh
